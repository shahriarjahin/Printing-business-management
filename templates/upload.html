<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>Upload documents · {{ config.business_name }}</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/usability.css"><script src="/static/theme.js"></script><script src="/static/upload-progress.js" defer></script><script src="/static/upload.js" defer></script></head>
<body class="public-body order-page"><header class="public-header"><a class="brand" href="/order"><img class="site-logo" src="/static/digitxbd-logo.png" alt="{{ config.business_name }}"></a></header>
<main class="order-layout"><section class="panel order-form"><h2>Upload documents</h2><p class="muted">At the shop? Upload your files here and tell us your printing instructions in person.</p>
<form id="upload-form" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Your name<input name="name" required maxlength="120" autocomplete="name"></label><label>WhatsApp / mobile<input name="phone" type="tel" required autocomplete="tel" placeholder="01XXXXXXXXX"><small id="customer-match" role="status">Use the same number for repeat visits.</small></label></div>
<label class="file-drop">Choose documents<input name="files" type="file" multiple required accept=".pdf,.doc,.docx,.odt,.jpg,.jpeg,.png,.txt,.pptx,.xlsx"><small>Up to 5 files · PDF, documents or images</small></label><p id="upload-selected" class="muted" aria-live="polite"></p>
<label>Note (optional)<textarea name="details" maxlength="4000" placeholder="For example: the file to print first"></textarea></label><label class="check"><input type="checkbox" name="consent" value="yes" required> I agree that the shop may open these files for printing.</label><p class="muted">{{ retention_notice }}</p><input name="website" tabindex="-1" autocomplete="off" class="hidden"><div id="upload-error" class="notice error hidden" role="alert"></div><button class="primary" type="submit">Upload documents →</button></form>
<div id="upload-success" class="hidden" role="status"></div><p class="muted">Ordering remotely? <a href="/online_order">Place an online order →</a></p></section></main></body></html>
