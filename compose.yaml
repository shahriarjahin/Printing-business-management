name: digitxbd
services:
  web:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8091}:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run the configure script first}
      SETUP_TOKEN: ${SETUP_TOKEN:?Run the configure script first}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8091}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MIGRATE_TRACKER: ${MIGRATE_TRACKER:-0}
      DATA_DIR: /data
    volumes:
      - digitxbd-data:/data
      - type: bind
        source: ${UPLOADS_DIR:-./DigitXBD-Uploads}
        target: /data/uploads
        bind:
          create_host_path: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  digitxbd-data:

