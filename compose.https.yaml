# Optional deployment on a server with a domain pointing to it.
# Set DOMAIN, PUBLIC_URL=https://your-domain, and COOKIE_SECURE=1 in .env.
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
